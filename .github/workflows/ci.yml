name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  server-audit-and-test:
    name: Server Test Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'server/package.json'

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Build Server
        working-directory: ./server
        run: npm run build

      - name: Run Server Test Suites (40 Tests)
        working-directory: ./server
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_secret_minimum_32_characters_long_for_unit_tests
          JWT_REFRESH_SECRET: ci_refresh_secret_minimum_32_characters_long
          ADMIN_SECRET: ci_admin_secret_minimum_16_chars
        run: npm test

  client-audit-and-build:
    name: Client Build Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'client/package.json'

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: TypeScript & Vite Production Build
        working-directory: ./client
        run: npm run build
